[project]
name = "grestin"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "httpx", "pydantic", "pyyaml", "python-dotenv",
  "jinja2", "rich", "openpyxl", "tenacity",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]