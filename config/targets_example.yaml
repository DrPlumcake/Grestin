# One file per target. Keep the declared_* fields: the contribution of the
# layer is the dissonance between declaration and observation, so a run
# without declarations can only produce findings, not dissonances.
legal_name: "Acme RAN S.p.A."
country: IT
domains:
  - acme-ran.example
aliases:
  - "Acme RAN SpA"
  - "Acme RAN"
# Registration identifiers from the procurement file. Without them the
# corporate pillar tops out at `moderate`: a name is not an identity.
identifiers:
  registrationNumber: "RM-1234567"
  vatCode: "IT01234567890"

declared_hosts: 3              # from the supplier's Phase 2 asset statement
declared_extra_eu: false
declared_breach_12m: false
notes: "5G RAN maintenance contract, remote access via VPN."
